[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keys-keys"
version = "2.0.7"
description = "An open-source Adaptive Hybrid Minecraft Server Copilot"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "TonyBucket" }]
dependencies = [
    "discord.py==2.7.1",
    "httpx==0.28.1",
    "PyYAML==6.0.3",
    "paramiko>=3.5,<5",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

