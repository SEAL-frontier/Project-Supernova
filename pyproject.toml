[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keys-keys"
version = "3.1.0-rc.3"
description = "An open-source Adaptive Hybrid Minecraft Server Copilot"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "TonyBucket" }]
dependencies = [
    "discord.py==2.7.1",
    "httpx==0.28.1",
    "PyYAML==6.0.3",
    "paramiko>=3.5,<5",
    "python-dotenv>=1.0,<2",
    "tzdata>=2024.1",
    "aiohttp>=3.9,<4",
]

[project.scripts]
keys-keys = "minecraft_agent.v3.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]
panel-login = ["playwright>=1.48,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"minecraft_agent.v3" = ["web_assets/*.png", "web_assets/*.jpg", "web_assets/*.html", "web_assets/*.css", "web_assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

